sentence=Shared message structs and framed-UART transport for the NewHere beacon ESP-NOW link.
paragraph=Defines Joystick_Msg, Power_Msg and Position_Msg with fixed-width types so the wire layout is identical on ESP32 and Teensy 4.1. Includes a sync-byte frame sender/receiver for carrying the same payloads over a UART, and a Teensy 4.1 example implementing the counterpart of the ESP32 beacon.
